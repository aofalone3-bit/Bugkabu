<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Schedule & Review System (Pro Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="w-[98%] mx-auto p-4 md:p-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🚀 ระบบจัดการและตรวจคิวส่งงาน (Pro Workspace)</h1>
                <p class="text-sm text-gray-500">ซิงค์ข้อมูลแบบเรียลไทม์ผ่าน GitHub สำหรับทีมงานและผู้ตรวจ</p>
            </div>
            <button onclick="toggleConfig()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg transition border">⚙️ ตั้งค่า GitHub</button>
        </div>

        <!-- Configuration Panel -->
        <div id="configPanel" class="hidden bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-600 mb-3">ตั้งค่าการเชื่อมต่อ GitHub (บันทึกอัตโนมัติ)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input type="text" id="repoOwner" placeholder="GitHub Username / Org" class="border p-2 rounded text-sm">
                <input type="text" id="repoName" placeholder="Repository Name" class="border p-2 rounded text-sm">
                <input type="text" id="filePath" placeholder="File Path (เช่น schedule.json)" value="schedule.json" class="border p-2 rounded text-sm">
                <input type="password" id="githubToken" placeholder="GitHub Personal Access Token (PAT)" class="border p-2 rounded text-sm">
            </div>
            <button onclick="loadData(); toggleConfig();" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 transition">บันทึกและเชื่อมต่อ</button>
        </div>

        <!-- Add / Edit Schedule Form -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100">
            <h2 id="formTitle" class="text-sm font-semibold text-gray-700 mb-3">➕ เพิ่มคิวส่งงานใหม่</h2>
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-3">
                <!-- ชื่อลูกค้า -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-500 font-medium">ชื่อลูกค้า / ชิ้นงาน</label>
                    <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้า..." class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white">
                </div>
                <!-- วันรับงาน -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-500 font-medium">📥 วันรับงาน</label>
                    <input type="date" id="receiveDate" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white">
                </div>
                <!-- วันส่งงาน + ติ๊กไม่ได้กำหนด -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-gray-500 font-medium">🏁 วันส่งงาน</label>
                        <label class="text-xs flex items-center gap-1 cursor-pointer text-gray-600 font-medium">
                            <input type="checkbox" id="noDeliveryDate" onchange="toggleDeliveryDate(this)" class="rounded"> ไม่ได้กำหนด
                        </label>
                    </div>
                    <input type="date" id="deliveryDate" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white">
                </div>
                <!-- เวลาส่ง -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-500 font-medium">⏰ เวลาส่ง</label>
                    <input type="time" id="deliveryTime" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white">
                </div>
                <!-- สถานะ -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs text-gray-500 font-medium">📌 สถานะงาน</label>
                    <select id="deliveryStatus" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white">
                        <option value="🔥 กำลังทำ">🔥 กำลังทำ</option>
                        <option value="⏳ รอดำเนินการ">⏳ รอดำเนินการ</option>
                        <option value="👍 Approved">👍 Approved</option>
                        <option value="✅ เสร็จสิ้น">✅ เสร็จสิ้น</option>
                    </select>
                </div>
            </div>

            <!-- ช่องรายละเอียดงานและฟีดแบ็ก -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <textarea id="deliveryDetails" rows="2" placeholder="📝 รายละเอียดงาน (สเปกงาน, ลิงก์ไฟล์งาน Google Drive ฯลฯ)" class="border p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white w-full"></textarea>
                <textarea id="reviewerFeedback" rows="2" placeholder="💬 ความเห็น/ข้อเสนอแนะจากผู้ตรวจ (ถ้ามี)" class="border p-2.5 rounded-lg text-sm bg-yellow-50 focus:bg-white w-full"></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="saveItem()" id="saveBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition shadow-sm">บันทึกคิวงานลงระบบ</button>
                <button onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-400 hover:bg-gray-500 text-white px-4 py-2.5 rounded-lg text-sm transition">ยกเลิก</button>
                <button onclick="loadData()" class="ml-auto bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm transition flex items-center gap-1">🔄 รีเฟรชข้อมูล</button>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="flex flex-col md:flex-row gap-3 mb-4">
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="🔍 ค้นหาชื่อลูกค้า หรือรายละเอียด..." class="flex-1 border p-2.5 rounded-xl text-sm bg-white shadow-sm">
            <select id="filterStatus" onchange="renderTable()" class="border p-2.5 rounded-xl text-sm bg-white shadow-sm md:w-64">
                <option value="ALL">📌 แสดงทุกสถานะ</option>
                <option value="🔥 กำลังทำ">🔥 กำลังทำ</option>
                <option value="⏳ รอดำเนินการ">⏳ รอดำเนินการ</option>
                <option value="👍 Approved">👍 Approved</option>
                <option value="✅ เสร็จสิ้น">✅ เสร็จสิ้น</option>
            </select>
        </div>

        <!-- Schedule Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-x-auto border border-gray-100">
            <table class="w-full text-left border-collapse min-w-[950px]">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                        <th class="p-3.5">ลูกค้า / งาน</th>
                        <th class="p-3.5">กำหนดการ & เวลา</th>
                        <th class="p-3.5">สถานะ</th>
                        <th class="p-3.5 w-2/5">รายละเอียดงาน & ฟีดแบ็กผู้ตรวจ</th>
                        <th class="p-3.5 text-center">จัดลำดับ</th>
                        <th class="p-3.5 text-center">ตรวจงานด่วน</th>
                        <th class="p-3.5 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="scheduleTable" class="divide-y divide-gray-100 text-sm">
                    <tr><td colspan="7" class="p-6 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let fileSha = "";
        let scheduleData = [];

        window.onload = function() {
            // ตั้งค่าวันรับงานเริ่มต้นเป็นวันนี้
            document.getElementById('receiveDate').value = new Date().toISOString().split('T')[0];

            if (localStorage.getItem('gh_owner')) document.getElementById('repoOwner').value = localStorage.getItem('gh_owner');
            if (localStorage.getItem('gh_repo')) document.getElementById('repoName').value = localStorage.getItem('gh_repo');
            if (localStorage.getItem('gh_path')) document.getElementById('filePath').value = localStorage.getItem('gh_path');
            if (localStorage.getItem('gh_token')) document.getElementById('githubToken').value = localStorage.getItem('gh_token');

            if (localStorage.getItem('gh_owner') && localStorage.getItem('gh_repo') && localStorage.getItem('gh_token')) {
                loadData();
            } else {
                document.getElementById('configPanel').classList.remove('hidden');
                document.getElementById('scheduleTable').innerHTML = `<tr><td colspan="7" class="p-6 text-center text-orange-500 font-medium">กรุณาคลิกปุ่ม "⚙️ ตั้งค่า GitHub" ด้านบนเพื่อเชื่อมต่อระบบก่อนใช้งาน</td></tr>`;
            }
        };

        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('hidden');
        }

        function toggleDeliveryDate(cb) {
            const dateInput = document.getElementById('deliveryDate');
            if (cb.checked) {
                dateInput.value = '';
                dateInput.disabled = true;
                dateInput.classList.add('bg-gray-200', 'cursor-not-allowed');
            } else {
                dateInput.disabled = false;
                dateInput.classList.remove('bg-gray-200', 'cursor-not-allowed');
            }
        }

        async function loadData() {
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const path = document.getElementById('filePath').value.trim();
            const token = document.getElementById('githubToken').value.trim();

            if (!owner || !repo || !token) {
                alert("กรุณากรอกข้อมูล GitHub Configuration ให้ครบถ้วน");
                document.getElementById('configPanel').classList.remove('hidden');
                return;
            }

            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_path', path);
            localStorage.setItem('gh_token', token);

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!response.ok) {
                    if(response.status === 404) {
                        scheduleData = [];
                        renderTable();
                        return;
                    }
                    throw new Error("ไม่สามารถโหลดไฟล์จาก GitHub ได้ (ตรวจสอบ Token หรือชื่อ Repo)");
                }

                const data = await response.json();
                fileSha = data.sha;
                const decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                scheduleData = Array.isArray(decodedContent) ? decodedContent : [];
                renderTable();
            } catch (error) {
                document.getElementById('scheduleTable').innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-400">เกิดข้อผิดพลาด: ${error.message}</td></tr>`;
            }
        }

        async function saveDataToGitHub() {
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const path = document.getElementById('filePath').value.trim();
            const token = document.getElementById('githubToken').value.trim();

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(scheduleData, null, 2))));

            const body = {
                message: "Update schedule & review status via Web App",
                content: contentEncoded,
                sha: fileSha
            };

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message);
            }

            const resData = await response.json();
            fileSha = resData.content.sha;
        }

        function renderTable() {
            const tbody = document.getElementById('scheduleTable');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedStatus = document.getElementById('filterStatus').value;

            if (scheduleData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">ยังไม่มีรายการคิวส่งงาน</td></tr>`;
                return;
            }

            const filtered = scheduleData.map((item, originalIndex) => ({ ...item, originalIndex }))
                .filter(item => {
                    const matchKeyword = (item.customer || '').toLowerCase().includes(keyword) || (item.details || '').toLowerCase().includes(keyword);
                    const matchStatus = selectedStatus === 'ALL' || item.status === selectedStatus;
                    return matchKeyword && matchStatus;
                });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">ไม่พบรายการที่ค้นหา</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((item) => {
                let badgeColor = "bg-gray-100 text-gray-700";
                if (item.status === "🔥 กำลังทำ") badgeColor = "bg-orange-100 text-orange-700 font-semibold";
                if (item.status === "⏳ รอดำเนินการ") badgeColor = "bg-yellow-100 text-yellow-700";
                if (item.status === "👍 Approved") badgeColor = "bg-blue-100 text-blue-700 font-semibold";
                if (item.status === "✅ เสร็จสิ้น") badgeColor = "bg-green-100 text-green-700";

                let deliveryDisplay = item.noDate ? '<span class="text-gray-400 italic">ไม่ได้กำหนด</span>' : (item.date || '-');

                return `
                    <tr class="hover:bg-gray-50/80 transition">
                        <td class="p-3.5 font-medium text-gray-800">${item.customer}</td>
                        <td class="p-3.5 text-gray-600 text-xs">
                            <div>📥 รับงาน: ${item.receiveDate || '-'}</div>
                            <div class="mt-0.5">🏁 กำหนดส่ง: ${deliveryDisplay}</div>
                            ${item.time ? `<div class="text-gray-500 mt-0.5">⏰ ${item.time}</div>` : ''}
                        </td>
                        <td class="p-3.5"><span class="px-2.5 py-1 rounded-full text-xs ${badgeColor}">${item.status || 'รอดำเนินการ'}</span></td>
                        <td class="p-3.5 text-gray-600">
                            <div class="whitespace-pre-line">${item.details || '-'}</div>
                            ${item.feedback ? `<div class="text-xs text-blue-700 bg-blue-50 p-1.5 mt-1.5 rounded-lg border border-blue-100">💬 ความเห็นผู้ตรวจ: ${item.feedback}</div>` : ''}
                        </td>
                        <td class="p-3.5 text-center space-x-1">
                            <button onclick="moveItem(${item.originalIndex}, -1)" class="text-gray-500 hover:text-black bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded text-xs" title="เลื่อนขึ้น">⬆️</button>
                            <button onclick="moveItem(${item.originalIndex}, 1)" class="text-gray-500 hover:text-black bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded text-xs" title="เลื่อนลง">⬇️</button>
                        </td>
                        <td class="p-3.5 text-center">
                            <button onclick="quickApprove(${item.originalIndex})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg shadow-sm transition">👍 อนุมัติงาน</button>
                        </td>
                        <td class="p-3.5 text-center space-x-1">
                            <button onclick="editItem(${item.originalIndex})" class="text-blue-600 hover:text-blue-800 text-xs bg-blue-50 px-2.5 py-1 rounded">แก้ไข</button>
                            <button onclick="deleteItem(${item.originalIndex})" class="text-red-600 hover:text-red-800 text-xs bg-red-50 px-2.5 py-1 rounded">ลบ</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function saveItem() {
            const customer = document.getElementById('customerName').value.trim();
            const receiveDate = document.getElementById('receiveDate').value;
            const noDate = document.getElementById('noDeliveryDate').checked;
            const date = noDate ? '' : document.getElementById('deliveryDate').value;
            const time = document.getElementById('deliveryTime').value;
            const status = document.getElementById('deliveryStatus').value;
            const details = document.getElementById('deliveryDetails').value.trim();
            const feedback = document.getElementById('reviewerFeedback').value.trim();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!customer || !receiveDate) {
                alert("กรุณากรอกชื่อลูกค้าและวันรับงานให้เรียบร้อย");
                return;
            }

            if (!noDate && !date) {
                alert("กรุณาเลือกวันส่งงาน หรือติ๊กเลือก 'ไม่ได้กำหนด'");
                return;
            }

            const itemData = { customer, receiveDate, date, noDate, time, status, details, feedback };

            if (editIndex === -1) {
                scheduleData.unshift(itemData);
            } else {
                scheduleData[editIndex] = itemData;
            }
            
            try {
                await saveDataToGitHub();
                resetForm();
                renderTable();
                alert("บันทึกข้อมูลเรียบร้อย!");
            } catch (error) {
                alert("บันทึกไม่สำเร็จ: " + error.message);
                loadData();
            }
        }

        async function quickApprove(index) {
            scheduleData[index].status = "👍 Approved";
            scheduleData[index].feedback = (scheduleData[index].feedback ? scheduleData[index].feedback + " | " : "") + "อนุมัติเรียบร้อย";
            try {
                await saveDataToGitHub();
                renderTable();
            } catch (error) {
                alert("อนุมัติไม่สำเร็จ: " + error.message);
                loadData();
            }
        }

        function editItem(index) {
            const item = scheduleData[index];
            document.getElementById('customerName').value = item.customer;
            document.getElementById('receiveDate').value = item.receiveDate || new Date().toISOString().split('T')[0];
            
            const noDateCheckbox = document.getElementById('noDeliveryDate');
            const deliveryDateInput = document.getElementById('deliveryDate');
            
            if (item.noDate) {
                noDateCheckbox.checked = true;
                deliveryDateInput.value = '';
                deliveryDateInput.disabled = true;
                deliveryDateInput.classList.add('bg-gray-200', 'cursor-not-allowed');
            } else {
                noDateCheckbox.checked = false;
                deliveryDateInput.value = item.date || '';
                deliveryDateInput.disabled = false;
                deliveryDateInput.classList.remove('bg-gray-200', 'cursor-not-allowed');
            }

            document.getElementById('deliveryTime').value = item.time || '';
            document.getElementById('deliveryStatus').value = item.status || "⏳ รอดำเนินการ";
            document.getElementById('deliveryDetails').value = item.details || '';
            document.getElementById('reviewerFeedback').value = item.feedback || '';
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').innerText = "✏️ แก้ไขคิวส่งงาน / ฟีดแบ็ก";
            document.getElementById('saveBtn').innerText = "อัปเดตข้อมูล";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('customerName').value = '';
            document.getElementById('receiveDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('deliveryDate').value = '';
            document.getElementById('deliveryDate').disabled = false;
            document.getElementById('deliveryDate').classList.remove('bg-gray-200', 'cursor-not-allowed');
            document.getElementById('noDeliveryDate').checked = false;
            document.getElementById('deliveryTime').value = '';
            document.getElementById('deliveryStatus').value = '🔥 กำลังทำ';
            document.getElementById('deliveryDetails').value = '';
            document.getElementById('reviewerFeedback').value = '';
            document.getElementById('editIndex').value = '-1';

            document.getElementById('formTitle').innerText = "➕ เพิ่มคิวส่งงานใหม่";
            document.getElementById('saveBtn').innerText = "บันทึกคิวงานลงระบบ";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        async function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= scheduleData.length) return;

            const temp = scheduleData[index];
            scheduleData[index] = scheduleData[newIndex];
            scheduleData[newIndex] = temp;

            try {
                await saveDataToGitHub();
                renderTable();
            } catch (error) {
                alert("จัดลำดับไม่สำเร็จ: " + error.message);
                loadData();
            }
        }

        async function deleteItem(index) {
            if (!confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) return;
            
            scheduleData.splice(index, 1);
            try {
                await saveDataToGitHub();
                renderTable();
            } catch (error) {
                alert("ลบไม่สำเร็จ: " + error.message);
                loadData();
            }
        }
    </script>
</body>
</html>
